  <!-- Toast -->

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBfaw8mkfO9HuVVnjT5oFl49l3Gad93cdM",
      authDomain: "tilavovlarshajarasi.firebaseapp.com",
      databaseURL: "https://tilavovlarshajarasi-default-rtdb.firebaseio.com",
      projectId: "tilavovlarshajarasi",
      storageBucket: "tilavovlarshajarasi.firebasestorage.app",
      messagingSenderId: "131863302267",
      appId: "1:131863302267:web:fed81f2d088f4f8ece12de",
      measurementId: "G-NBV8X0HR8M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    (function () {
      let state = getSampleData();
      let selectedId = state.members.length > 0 ? state.members[0].id : null;
      let searchQuery = '';
      let activeTab = 'tree';

      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let isPanning = false;
      let startPanX = 0;
      let startPanY = 0;
      let pendingConfirmAction = null;
      let isFirebaseSyncing = false;

      // Realtime listener from Firebase
      db.ref('shajaraData').on('value', (snapshot) => {
        if (isFirebaseSyncing) return;
        const val = snapshot.val();
        if (val && Array.isArray(val.members)) {
          state = normalizeCouplesData(val);
          if (!selectedId && state.members.length > 0) {
            selectedId = state.members[0].id;
          }
          renderAll();
        }
      });

      function getNowFormatted() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function getSampleData() {
        return {
          title: 'Tilavovlar Shajarasi',
          subtitle: 'Sulola tarixi va avlodlar shajarasi (Umumiy baza)',
          updatedAt: getNowFormatted(),
          layoutDirection: 'vertical',
          theme: 'modern',
          members: [
            {
              id: 'm1',
              name: 'Tilavov (Boshboboo)',
              role: 'Sulola boshlig\'i',
              gender: 'male',
              birthYear: '1940',
              deathYear: '',
              birthPlace: 'Toshkent',
              occupation: 'Ustoz',
              bio: 'Sulola asoschisi.',
              photo: '',
              cardColor: 'auto',
              fatherId: null,
              motherId: null,
              parentId: null,
              spouseId: 'm1_sp',
              spouseName: 'Xonzoda Tilavova',
              generation: 1
            },
            {
              id: 'm1_sp',
              name: 'Xonzoda Tilavova',
              role: 'Buvi',
              gender: 'female',
              birthYear: '1945',
              deathYear: '',
              birthPlace: 'Toshkent',
              occupation: 'Uy bekasi',
              bio: 'Mehribon ona.',
              photo: '',
              cardColor: 'auto',
              fatherId: null,
              motherId: null,
              parentId: null,
              spouseId: 'm1',
              spouseName: 'Tilavov',
              generation: 1
            }
          ]
        };
      }

      function normalizeCouplesData(data) {
        if (!data || !Array.isArray(data.members)) return getSampleData();
        if (!data.subtitle) data.subtitle = 'Sulola tarixi va avlodlar shajarasi';
        const map = new Map();
        data.members.forEach(m => map.set(m.id, m));

        data.members.forEach(m => {
          if (m.spouseId && map.has(m.spouseId) && m.spouseId !== m.id) {
            const sp = map.get(m.spouseId);
            sp.spouseId = m.id;
            m.spouseName = sp.name;
            sp.spouseName = m.name;
          } else {
            m.spouseId = null;
            m.spouseName = '';
          }
        });
        return data;
      }

      function saveState(showToastMsg = true) {
        normalizeCouplesData(state);
        state.updatedAt = getNowFormatted();
        isFirebaseSyncing = true;
        db.ref('shajaraData').set(state).then(() => {
          isFirebaseSyncing = false;
          if (showToastMsg) showToast('Barcha o\'zgarishlar internet bazasiga saqlandi! ☁️');
        }).catch(() => {
          isFirebaseSyncing = false;
          showToast('Saqlashda xatolik yuz berdi', 'error');
        });
      }

      function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 transition-all duration-200 ${type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2600);
      }

      function generateId() {
        return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 6);
      }

      function recomputeGenerations() {
        const map = new Map();
        state.members.forEach(m => { map.set(m.id, m); m.generation = 1; });
        const maxIter = state.members.length + 6;
        for (let i = 0; i < maxIter; i++) {
          let changed = false;
          state.members.forEach(m => {
            const f = m.fatherId ? map.get(m.fatherId) : null;
            const mo = m.motherId ? map.get(m.motherId) : null;
            const p = m.parentId ? map.get(m.parentId) : null;
            let minAllowed = 1;
            if (f && f.id !== m.id) minAllowed = Math.max(minAllowed, (f.generation || 1) + 1);
            if (mo && mo.id !== m.id) minAllowed = Math.max(minAllowed, (mo.generation || 1) + 1);
            if (p && p.id !== m.id) minAllowed = Math.max(minAllowed, (p.generation || 1) + 1);
            if (m.generation < minAllowed) { m.generation = minAllowed; changed = true; }
          });
          if (!changed) break;
        }
      }

      function computeTreeLayout() {
        normalizeCouplesData(state);
        recomputeGenerations();
        const isHorizontal = state.layoutDirection === 'horizontal';
        const nodeW = 220, nodeH = 128, spouseGap = isHorizontal ? 34 : 38, siblingGap = isHorizontal ? 32 : 36, levelGap = isHorizontal ? 98 : 94;
        const memberMap = new Map();
        state.members.forEach(m => memberMap.set(m.id, m));

        const partnerPaired = new Set();
        const primaryToPartner = new Map();
        const unitPrimary = new Map();

        state.members.forEach(m => {
          if (partnerPaired.has(m.id) || primaryToPartner.has(m.id)) return;
          if (m.spouseId && memberMap.has(m.spouseId)) {
            const sp = memberMap.get(m.spouseId);
            if (partnerPaired.has(sp.id) || primaryToPartner.has(sp.id)) return;
            primaryToPartner.set(m.id, sp);
            partnerPaired.add(sp.id);
            unitPrimary.set(m.id, m.id);
            unitPrimary.set(sp.id, m.id);
          } else {
            unitPrimary.set(m.id, m.id);
          }
        });

        const rootUnits = [];
        state.members.forEach(m => {
          if (partnerPaired.has(m.id)) return;
          const pId = m.fatherId || m.motherId || m.parentId;
          if (!pId || !memberMap.has(pId)) rootUnits.push(m);
        });
        if (rootUnits.length === 0 && state.members.length > 0) rootUnits.push(state.members[0]);

        const unitSpan = new Map();
        function measure(primary) {
          const hasP = primaryToPartner.has(primary.id);
          const single = isHorizontal ? nodeH : nodeW;
          const own = hasP ? (single * 2 + spouseGap) : single;
          const kids = state.members.filter(c => c.fatherId === primary.id || c.motherId === primary.id || c.parentId === primary.id);
          if (kids.length === 0) { unitSpan.set(primary.id, own); return own; }
          let kidsTotal = 0;
          kids.forEach((k, idx) => { if (idx > 0) kidsTotal += siblingGap; kidsTotal += measure(k); });
          const span = Math.max(own, kidsTotal);
          unitSpan.set(primary.id, span);
          return span;
        }
        rootUnits.forEach(r => measure(r));

        const positions = new Map();
        const couplesList = [];
        const visited = new Set();

        function place(primary, breadthStart) {
          if (visited.has(primary.id)) return;
          visited.add(primary.id);
          const depth = Math.max(0, (primary.generation || 1) - 1);
          const span = unitSpan.get(primary.id) || (isHorizontal ? nodeH : nodeW);
          const center = breadthStart + span / 2;
          const partner = primaryToPartner.get(primary.id);
          const kids = state.members.filter(c => c.fatherId === primary.id || c.motherId === primary.id || c.parentId === primary.id);

          if (!isHorizontal) {
            const y = depth * (nodeH + levelGap);
            if (partner) {
              positions.set(primary.id, { x: center - spouseGap / 2 - nodeW, y, w: nodeW, h: nodeH });
              positions.set(partner.id, { x: center + spouseGap / 2, y, w: nodeW, h: nodeH });
              couplesList.push({ primaryId: primary.id, partnerId: partner.id, unionX: center, unionY: y + nodeH / 2, kids: kids.map(k => k.id) });
            } else {
              positions.set(primary.id, { x: center - nodeW / 2, y, w: nodeW, h: nodeH });
              couplesList.push({ primaryId: primary.id, partnerId: null, unionX: center, unionY: y + nodeH, kids: kids.map(k => k.id) });
            }
          }
          if (kids.length > 0) {
            let totalK = 0;
            kids.forEach((k, i) => { if (i > 0) totalK += siblingGap; totalK += unitSpan.get(k.id) || nodeW; });
            let cursor = center - totalK / 2;
            kids.forEach(k => {
              const kSpan = unitSpan.get(k.id) || nodeW;
              place(k, cursor);
              cursor += kSpan + siblingGap;
            });
          }
        }

        let cursor = 0;
        rootUnits.forEach((r, idx) => {
          if (idx > 0) cursor += siblingGap * 1.4;
          const span = unitSpan.get(r.id) || nodeW;
          place(r, cursor);
          cursor += span;
        });

        state.members.forEach(m => {
          if (!positions.has(m.id)) positions.set(m.id, { x: cursor, y: 0, w: nodeW, h: nodeH });
        });

        return { positions, couplesList, isHorizontal };
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function getInitials(name) {
        const parts = String(name || '').trim().split(/\s+/);
        if (parts.length === 0 || !parts[0]) return '?';
        return parts.length === 1 ? parts[0].charAt(0).toUpperCase() : (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
      }

      function getCardAccentColor(m) {
        return m.gender === 'female' ? '#db2777' : '#0284c7';
      }

      function updateQuickBar() {
        const bar = document.getElementById('selectedPersonQuickBar');
        const member = state.members.find(m => m.id === selectedId);
        if (!member) { bar.classList.add('hidden'); return; }
        bar.classList.remove('hidden');
        document.getElementById('quickBarPersonName').textContent = member.name;
        document.getElementById('quickBarGenderDot').className = `w-2.5 h-2.5 rounded-full ${member.gender === 'female' ? 'bg-pink-600' : 'bg-sky-600'}`;
      }

      function renderTree() {
        const linksLayer = document.getElementById('linksLayer');
        const nodesLayer = document.getElementById('nodesLayer');
        linksLayer.innerHTML = '';
        nodesLayer.innerHTML = '';

        document.getElementById('familyTitleInput').value = state.title || 'Tilavovlar Shajarasi';
        document.getElementById('memberCountBadge').textContent = `${state.members.length} kishi`;
        updateQuickBar();

        if (state.members.length === 0) return;
        const { positions, couplesList, isHorizontal } = computeTreeLayout();
        const q = searchQuery.trim().toLowerCase();

        couplesList.forEach(unit => {
          const pPos = positions.get(unit.primaryId);
          const spPos = unit.partnerId ? positions.get(unit.partnerId) : null;
          if (!pPos) return;

          if (spPos) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pPos.x + pPos.w);
            line.setAttribute('y1', unit.unionY);
            line.setAttribute('x2', spPos.x);
            line.setAttribute('y2', unit.unionY);
            line.setAttribute('stroke', '#f43f5e');
            line.setAttribute('stroke-width', '3');
            line.setAttribute('stroke-dasharray', '4 2');
            linksLayer.appendChild(line);
          }

          if (unit.kids) {
            unit.kids.forEach(childId => {
              const cPos = positions.get(childId);
              if (!cPos) return;
              const startX = unit.unionX, startY = spPos ? unit.unionY + 13 : pPos.y + pPos.h;
              const dropY = pPos.y + pPos.h + 28, endX = cPos.x + cPos.w / 2, endY = cPos.y;
              const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              path.setAttribute('d', `M ${startX} ${startY} L ${startX} ${dropY} C ${startX} ${(dropY+endY)/2}, ${endX} ${(dropY+endY)/2}, ${endX} ${endY}`);
              path.setAttribute('fill', 'none');
              path.setAttribute('stroke', '#94a3b8');
              path.setAttribute('stroke-width', '2');
              linksLayer.appendChild(path);
            });
          }
        });

        state.members.forEach(m => {
          const pos = positions.get(m.id);
          if (!pos) return;
          const isSelected = m.id === selectedId;
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
          g.setAttribute('class', 'node-card');

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('class', 'card-bg');
          rect.setAttribute('width', pos.w);
          rect.setAttribute('height', pos.h);
          rect.setAttribute('rx', '16');
          rect.setAttribute('fill', '#ffffff');
          rect.setAttribute('stroke', isSelected ? '#059669' : '#cbd5e1');
          rect.setAttribute('stroke-width', isSelected ? '3' : '1.5');
          rect.setAttribute('filter', 'url(#cardShadow)');
          g.appendChild(rect);

          const topBar = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          topBar.setAttribute('d', `M 14 0 H ${pos.w - 14} A 14 14 0 0 1 ${pos.w} 14 V 6 H 0 V 14 A 14 14 0 0 1 14 0 Z`);
          topBar.setAttribute('fill', getCardAccentColor(m));
          g.appendChild(topBar);

          const avatarCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          avatarCircle.setAttribute('cx', '32');
          avatarCircle.setAttribute('cy', '46');
          avatarCircle.setAttribute('r', '19');
          avatarCircle.setAttribute('fill', getCardAccentColor(m));
          g.appendChild(avatarCircle);

          const initialsTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          initialsTxt.setAttribute('x', '32');
          initialsTxt.setAttribute('y', '50.5');
          initialsTxt.setAttribute('text-anchor', 'middle');
          initialsTxt.setAttribute('fill', '#ffffff');
          initialsTxt.setAttribute('font-size', '12.5');
          initialsTxt.setAttribute('font-weight', '700');
          initialsTxt.textContent = getInitials(m.name);
          g.appendChild(initialsTxt);

          const nameTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          nameTxt.setAttribute('x', '58');
          nameTxt.setAttribute('y', '42');
          nameTxt.setAttribute('fill', '#0f172a');
          nameTxt.setAttribute('font-size', '12.5');
          nameTxt.setAttribute('font-weight', '700');
          nameTxt.textContent = (m.name || 'Ismsiz').length > 17 ? m.name.slice(0, 16) + '…' : m.name;
          g.appendChild(nameTxt);

          const roleTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          roleTxt.setAttribute('x', '58');
          roleTxt.setAttribute('y', '58');
          roleTxt.setAttribute('fill', getCardAccentColor(m));
          roleTxt.setAttribute('font-size', '10.5');
          roleTxt.setAttribute('font-weight', '600');
          roleTxt.textContent = m.role || 'Oila a\'zosi';
          g.appendChild(roleTxt);

          g.addEventListener('click', () => { selectMember(m.id); });
          nodesLayer.appendChild(g);
        });

        updateTransform();
      }

      function updateTransform() {
        const group = document.getElementById('treeTransformGroup');
        group.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoom})`);
        document.getElementById('zoomLevelText').textContent = `${Math.round(zoom * 100)}%`;
      }

      function fitTreeToViewport() {
        zoom = 1; panX = 40; panY = 40;
        updateTransform();
      }

      function centerOnMember(memberId) {
        selectMember(memberId);
      }

      function selectMember(id) {
        selectedId = id;
        renderTree();
        renderSidebar();
      }

      function renderSidebar() {
        const container = document.getElementById('sidebarContent');
        const member = state.members.find(m => m.id === selectedId);
        if (!member) { container.innerHTML = '<p class="text-xs text-slate-500">Shaxs tanlanmagan</p>'; return; }

        container.innerHTML = `
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
            <h3 class="font-bold text-slate-900 text-sm">${escapeHtml(member.name)}</h3>
            <p class="text-xs text-slate-500">${escapeHtml(member.role || '')}</p>
          </div>
          <form id="editMemberForm" class="space-y-3 pt-2">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Ism va familiya</label>
              <input id="editName" type="text" value="${escapeHtml(member.name)}" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Jinsi</label>
              <select id="editGender" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">
                <option value="male" ${member.gender === 'male' ? 'selected' : ''}>Erkak</option>
                <option value="female" ${member.gender === 'female' ? 'selected' : ''}>Ayol</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Tug'ilgan yili</label>
              <input id="editBirthYear" type="text" value="${escapeHtml(member.birthYear)}" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg" />
            </div>
            <button type="submit" class="w-full py-2 px-4 rounded-xl bg-emerald-600 text-white font-semibold text-xs shadow-sm">Saqlash</button>
            <button type="button" id="deleteMemberBtn" class="w-full py-2 px-4 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-semibold text-xs">O'chirish</button>
          </form>
        `;

        document.getElementById('editMemberForm').addEventListener('submit', (e) => {
          e.preventDefault();
          member.name = document.getElementById('editName').value.trim() || 'Ismsiz';
          member.gender = document.getElementById('editGender').value;
          member.birthYear = document.getElementById('editBirthYear').value.trim();
          saveState();
          renderTree();
          renderSidebar();
        });

        document.getElementById('deleteMemberBtn').addEventListener('click', () => {
          state.members = state.members.filter(m => m.id !== member.id);
          selectedId = state.members.length > 0 ? state.members[0].id : null;
          saveState();
          renderTree();
          renderSidebar();
        });
      }

      function renderListView() {
        const wrapper = document.getElementById('generationListWrapper');
        wrapper.innerHTML = state.members.map(m => `
          <div class="p-3 bg-white rounded-xl border flex justify-between items-center">
            <div><strong>${escapeHtml(m.name)}</strong> (${escapeHtml(m.role || '')})</div>
            <button onclick="selectMember('${m.id}')" class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded">Tanlash</button>
          </div>
        `).join('');
      }

      function renderAll() {
        renderTree();
        renderSidebar();
        renderListView();
      }

      function openAddRelativeModal(targetId, relType) {
        const newId = generateId();
        const newMember = {
          id: newId,
          name: 'Yangi A\'zo',
          gender: 'male',
          role: relType === 'spouse' ? 'Turmush o\'rtog\'i' : 'Farzand',
          birthYear: '2000',
          deathYear: '',
          birthPlace: 'Toshkent',
          occupation: '',
          bio: '',
          photo: '',
          cardColor: 'auto',
          fatherId: null,
          motherId: null,
          parentId: null,
          spouseId: null,
          spouseName: '',
          generation: 2
        };

        const target = state.members.find(m => m.id === targetId);
        if (target && relType === 'spouse') {
          target.spouseId = newId;
          target.spouseName = newMember.name;
          newMember.spouseId = target.id;
          newMember.spouseName = target.name;
        } else if (target && relType === 'child') {
          newMember.fatherId = target.id;
        }

        state.members.push(newMember);
        saveState();
        renderAll();
        selectMember(newId);
        showToast('Yangi shaxs qo\'shildi!');
      }

      // Event Listeners
      document.getElementById('quickSaveBtn').addEventListener('click', () => saveState(true));

      document.getElementById('addRootPersonBtn').addEventListener('click', () => {
        openAddRelativeModal(selectedId, 'child');
      });
      document.getElementById('quickAddSpouseTopBtn').addEventListener('click', () => {
        if (!selectedId) return;
        openAddRelativeModal(selectedId, 'spouse');
      });

      document.getElementById('quickBarFatherBtn').addEventListener('click', () => { if (selectedId) openAddRelativeModal(selectedId, 'father'); });
      document.getElementById('quickBarMotherBtn').addEventListener('click', () => { if (selectedId) openAddRelativeModal(selectedId, 'mother'); });
      document.getElementById('quickBarSpouseBtn').addEventListener('click', () => { if (selectedId) openAddRelativeModal(selectedId, 'spouse'); });
      document.getElementById('quickBarSonBtn').addEventListener('click', () => { if (selectedId) openAddRelativeModal(selectedId, 'child'); });
      document.getElementById('quickBarDaughterBtn').addEventListener('click', () => { if (selectedId) openAddRelativeModal(selectedId, 'child'); });

      const viewport = document.getElementById('canvasViewport');
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node-card')) return;
        isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - startPanX; panY = e.clientY - startPanY;
        updateTransform();
      });
      window.addEventListener('mouseup', () => { isPanning = false; });

      document.getElementById('zoomInBtn').addEventListener('click', () => { zoom *= 1.15; updateTransform(); });
      document.getElementById('zoomOutBtn').addEventListener('click', () => { zoom *= 0.85; updateTransform(); });
      document.getElementById('zoomFitBtn').addEventListener('click', fitTreeToViewport);

      document.getElementById('tabTreeBtn').addEventListener('click', () => {
        activeTab = 'tree';
        document.getElementById('treeViewContainer').classList.remove('hidden');
        document.getElementById('listViewContainer').classList.add('hidden');
      });
      document.getElementById('tabListBtn').addEventListener('click', () => {
        activeTab = 'list';
        document.getElementById('treeViewContainer').classList.add('hidden');
        document.getElementById('listViewContainer').classList.remove('hidden');
        renderListView();
      });

      document.getElementById('layoutDirBtn').addEventListener('click', () => {
        state.layoutDirection = state.layoutDirection === 'horizontal' ? 'vertical' : 'horizontal';
        renderTree();
      });

      document.getElementById('exportPngBtn').addEventListener('click', () => {
        showToast('PNG eksport tayyorlanmoqda...');
      });

      window.addEventListener('DOMContentLoaded', () => {
        fitTreeToViewport();
      });
    })();
  </script>
</body>
</html>
